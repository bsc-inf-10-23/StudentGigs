# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Gradle JVM memory & GC settings for fast execution
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Kotlin compiler daemon JVM arguments to prevent connection failures and speed up compilation
kotlin.daemon.jvmargs=-Xmx2048m -XX:+UseParallelGC

# Build Caching & Parallel execution
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Incremental Kotlin compilation optimizations
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

# Android Gradle Plugin build speed optimizations
android.nonFinalResIds=true
android.nonTransitiveRClass=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process


# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
